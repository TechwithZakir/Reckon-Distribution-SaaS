name: CI

on:
  push:
  pull_request:

jobs:
  frappe-tests:
    name: Frappe ${{ matrix.frappe-branch }} / ERPNext ${{ matrix.erpnext-branch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe-branch: version-15
            erpnext-branch: version-15
            python-version: "3.10"
          - frappe-branch: version-16
            erpnext-branch: version-16
            python-version: "3.11"

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff tomli

      - name: Validate app metadata for supported Frappe and ERPNext branches
        run: |
          python - <<'PY'
          from pathlib import Path
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text())
          deps = data["tool"]["bench"]["frappe-dependencies"]
          assert deps["frappe"] == ">=15.0.0,<17.0.0", deps["frappe"]
          assert deps["erpnext"] == ">=15.0.0,<17.0.0", deps["erpnext"]
          assert Path("reckon_distribution/hooks.py").exists()
          assert Path("reckon_distribution/patches.txt").exists()
          assert Path("reckon_distribution/modules.txt").read_text().strip() == "Distribution"
          PY

      - name: Compile Python and validate JSON
        run: |
          python -m compileall -q reckon_distribution
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("reckon_distribution").rglob("*.json"):
              json.loads(path.read_text())
          PY

      - name: Lint Python
        run: ruff check .

      - name: Check HRMS remains optional
        run: |
          python - <<'PY'
          from pathlib import Path

          distribution_hooks = Path("reckon_distribution/hooks.py").read_text()
          assert 'required_apps = ["erpnext", "reckon_saas_platform"]' in distribution_hooks
          assert '"hrms"' not in distribution_hooks.lower()
          PY
