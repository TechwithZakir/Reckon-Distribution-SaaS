{% extends "templates/web.html" %}

{% block title %}Reckon ERP Signup{% endblock %}

{% block page_content %}
<main class="reckon-distribution-shell">
  <section class="rd-hero">
    <p class="rd-kicker">Reckon Distribution SaaS</p>
    <h1>Create your distribution company</h1>
    <p>Submit the business details. Access opens after vendor payment verification and tenant provisioning.</p>
    <form method="post" action="/api/method/reckon_distribution.saas.public_signup">
      <div class="form-group"><label>Business Name</label><input class="form-control" name="business_name" required></div>
      <div class="form-group"><label>Owner Name</label><input class="form-control" name="owner_name" required></div>
      <div class="form-group"><label>Owner Email</label><input class="form-control" name="owner_email" type="email" required></div>
      <div class="form-group">
        <label>Plan</label>
        <select class="form-control" name="plan" required>
          {% for plan in plans %}
          <option value="{{ plan.name }}">{{ plan.plan_name }} {{ plan.currency }} {{ plan.price }} / {{ plan.billing_cycle }}</option>
          {% endfor %}
        </select>
      </div>
      <input type="hidden" name="billing_cycle" value="Monthly">
      <button class="btn btn-primary" type="submit">Submit Signup</button>
    </form>
  </section>
</main>
{% endblock %}
