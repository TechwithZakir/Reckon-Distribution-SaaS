name: CI

on:
  push:
  pull_request:

jobs:
  frappe-tests:
    name: Frappe ${{ matrix.frappe-branch }} / ERPNext ${{ matrix.erpnext-branch }}
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis-cache:
        image: redis:7
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7
        ports:
          - 11000:6379
      redis-socketio:
        image: redis:7
        ports:
          - 12000:6379
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe-branch: version-15
            erpnext-branch: version-15
            python-version: "3.10"
          - frappe-branch: version-16
            erpnext-branch: version-16
            python-version: "3.11"

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bench
        run: pip install frappe-bench

      - name: Initialize bench
        run: |
          bench init frappe-bench --skip-redis-config-generation --frappe-branch ${{ matrix.frappe-branch }} --python "$(which python)"
          cd frappe-bench
          bench get-app erpnext --branch ${{ matrix.erpnext-branch }}
          cp -R "$GITHUB_WORKSPACE" apps/reckon_distribution

      - name: Create test site and install apps
        working-directory: frappe-bench
        run: |
          cat > sites/common_site_config.json <<'JSON'
          {
            "db_host": "127.0.0.1",
            "redis_cache": "redis://127.0.0.1:13000",
            "redis_queue": "redis://127.0.0.1:11000",
            "redis_socketio": "redis://127.0.0.1:12000"
          }
          JSON
          bench new-site test_site --mariadb-root-password root --admin-password admin --no-mariadb-socket
          bench --site test_site install-app erpnext
          bench --site test_site install-app reckon_distribution

      - name: Lint Python
        working-directory: frappe-bench/apps/reckon_distribution
        run: |
          python -m pip install ruff
          ruff check .

      - name: Run app tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app reckon_distribution
